<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microbit Robot Controller</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Space Mono for that 'tech' feel -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* BBC Microbit Color Palette */
            --bg-color: #1a1a1a;
            --panel-color: #000000;
            --accent-green: #00E463; /* Microbit Logo Green */
            --accent-red: #FF0000;    /* LED Matrix Red */
            --text-color: #ffffff;
            --connector-gold: #E7A600;
            --tab-inactive: #333333;
        }

        body {
            font-family: 'Space Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* --- Buttons --- */
        .connect-btn {
            background-color: #333;
            border: 2px solid var(--accent-green);
            color: var(--accent-green);
            transition: all 0.3s ease;
        }
        
        .connect-btn:hover {
            background-color: var(--accent-green);
            color: black;
        }

        .connect-btn.connected {
            background-color: var(--accent-green);
            color: black;
            box-shadow: 0 0 20px var(--accent-green);
        }

        .icon-btn {
            background-color: transparent;
            border: 2px solid #555;
            color: #888;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .icon-btn:hover {
            border-color: var(--connector-gold);
            color: var(--connector-gold);
        }

        /* D-Pad / Tank Styling */
        .dpad-btn {
            background-color: #222;
            border: 2px solid #444;
            color: #666;
            transition: all 0.1s;
            font-weight: bold;
        }

        .dpad-btn.active {
            background-color: var(--accent-red);
            border-color: var(--accent-red);
            color: white;
            box-shadow: 0 0 15px var(--accent-red);
            transform: scale(0.95);
        }

        /* Speaker Button */
        .speaker-btn {
            background-color: #222;
            border: 2px solid var(--connector-gold);
            color: var(--connector-gold);
            border-radius: 50%;
            transition: all 0.1s;
        }

        .speaker-btn.active {
            background-color: var(--connector-gold);
            color: black;
            transform: scale(0.90);
            box-shadow: 0 0 15px var(--connector-gold);
        }

        /* Keyboard Key Styling for Servos */
        .key-btn {
            background-color: #222;
            border: 1px solid #444;
            border-bottom: 4px solid #111; /* Key depth look */
            border-radius: 6px;
            color: white;
            transition: all 0.05s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 80px;
            cursor: pointer; 
            user-select: none;
        }

        .key-btn:active, .key-btn.active {
            transform: translateY(3px);
            border-bottom: 1px solid #111;
            background-color: #333;
            color: var(--accent-green);
            box-shadow: 0 0 10px rgba(0, 228, 99, 0.2);
            border-color: var(--accent-green);
        }

        .key-btn.close-btn:active, .key-btn.close-btn.active {
             color: var(--connector-gold);
             border-color: var(--connector-gold);
             box-shadow: 0 0 10px rgba(231, 166, 0, 0.2);
        }

        /* Custom Input Styling for Editable Labels */
        .editable-label {
            background: transparent;
            border: none;
            text-align: center;
            color: inherit;
            width: 100%;
            pointer-events: auto; 
        }
        .editable-label:focus {
            outline: none;
            background-color: rgba(255,255,255,0.1);
            border-radius: 4px;
        }

        .led-dot {
            width: 8px;
            height: 8px;
            background-color: #333;
            border-radius: 2px;
        }
        .led-dot.on {
            background-color: var(--accent-red);
            box-shadow: 0 0 4px var(--accent-red);
        }

        /* Tab Styling */
        .tab-btn {
            background-color: var(--tab-inactive);
            color: #888;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: var(--panel-color);
            color: var(--accent-green);
            border-top: 2px solid var(--accent-green);
        }

        /* Modal Styling */
        .modal-overlay {
            background-color: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
        }
        .bind-row {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .bind-key {
            background: #000;
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .bind-key:hover {
            background: var(--accent-green);
            color: black;
        }
        .bind-key.recording {
            background: var(--accent-red);
            border-color: var(--accent-red);
            color: white;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

    </style>
</head>
<body class="flex flex-col h-screen max-h-screen">

    <!-- Header -->
    <header class="p-4 flex justify-between items-center border-b border-gray-800 bg-black flex-none">
        <div class="flex items-center gap-3">
            <div class="w-8 h-6 bg-black border border-white rounded-sm flex items-center justify-center gap-[2px]">
                <div class="led-dot on"></div>
                <div class="led-dot"></div>
                <div class="led-dot on"></div>
            </div>
            <div class="flex flex-col">
                <h1 class="text-xl font-bold tracking-wider text-green-400 leading-none">MICRO:BIT<span class="text-white text-sm ml-2 opacity-70">CONTROL</span></h1>
                <span class="text-[9px] text-gray-500 tracking-widest mt-1">BLE INTERFACE V1.2</span>
            </div>
        </div>
        <div class="flex gap-2">
            <button id="settingsBtn" class="icon-btn" title="Key Bindings">
                ⚙️
            </button>
            <a href="help.html" class="icon-btn no-underline font-bold" title="Help">
                ?
            </a>
            <button id="connectBtn" class="connect-btn px-6 py-2 rounded-md font-bold text-sm tracking-widest flex items-center gap-2">
                <span id="btIcon">⚡</span>
                <span id="btText">CONNECT</span>
            </button>
        </div>
    </header>

    <!-- Main Control Area -->
    <main class="flex-grow flex flex-col md:flex-row p-4 gap-6 items-stretch justify-center overflow-hidden">

        <!-- Left Column: Driving Controls -->
        <div class="w-full md:w-1/2 flex flex-col bg-black rounded-xl border border-gray-800 shadow-2xl relative order-2 md:order-1 overflow-hidden">
             
            <!-- Decorative Gold Line -->
             <div class="absolute bottom-0 left-0 w-full h-2 bg-gradient-to-r from-yellow-600 to-yellow-400 rounded-b-xl opacity-80 z-10"></div>

            <!-- Tabs -->
            <div class="flex w-full border-b border-gray-800 h-12 flex-none">
                <button id="tabWASD" class="tab-btn flex-1 font-bold tracking-widest text-sm active" onclick="switchMode('WASD')">WASD MODE</button>
                <button id="tabTank" class="tab-btn flex-1 font-bold tracking-widest text-sm" onclick="switchMode('TANK')">L/R TANK MODE</button>
            </div>

            <!-- Content Container -->
            <div class="flex-grow relative p-6 flex items-center justify-center">

                <!-- WASD Panel -->
                <div id="panelWASD" class="w-full h-full flex flex-col items-center justify-center transition-opacity duration-200">
                    <div class="grid grid-cols-3 grid-rows-3 gap-3 w-full max-w-[400px] aspect-square">
                        <!-- Top Row -->
                        <div></div>
                        <button id="btnUp" class="dpad-btn rounded-t-lg flex flex-col items-center justify-center hover:bg-gray-800">
                            <span class="text-2xl">▲</span>
                            <span class="text-[10px] opacity-50 display-key" data-action="forward">W</span>
                        </button>
                        <div></div>
                        
                        <!-- Middle Row -->
                        <button id="btnLeft" class="dpad-btn rounded-l-lg flex flex-col items-center justify-center hover:bg-gray-800">
                            <span class="text-2xl">◀</span>
                            <span class="text-[10px] opacity-50 display-key" data-action="left">A</span>
                        </button>
                        
                        <!-- Center Speaker -->
                        <div class="flex items-center justify-center">
                            <button id="btnSpeaker" class="speaker-btn w-16 h-16 flex flex-col items-center justify-center shadow-lg" title="Horn">
                                <span class="text-xl">🔊</span>
                                <span class="text-[8px] mt-1 opacity-70 display-key" data-action="horn">SPACE</span>
                            </button>
                        </div>
        
                        <button id="btnRight" class="dpad-btn rounded-r-lg flex flex-col items-center justify-center hover:bg-gray-800">
                            <span class="text-2xl">▶</span>
                            <span class="text-[10px] opacity-50 display-key" data-action="right">D</span>
                        </button>
                        
                        <!-- Bottom Row -->
                        <div></div>
                        <button id="btnDown" class="dpad-btn rounded-b-lg flex flex-col items-center justify-center hover:bg-gray-800">
                            <span class="text-2xl">▼</span>
                            <span class="text-[10px] opacity-50 display-key" data-action="backward">S</span>
                        </button>
                        <div></div>
                    </div>
                </div>

                <!-- Tank Panel (Hidden by default) -->
                <div id="panelTank" class="hidden w-full h-full flex items-center justify-center gap-4 max-w-[400px]">
                    
                    <!-- Left Track -->
                    <div class="flex-1 h-full flex flex-col gap-2">
                        <div class="text-center text-[10px] text-gray-500 font-mono tracking-widest">LEFT MOTOR</div>
                        <button id="btnL_Fwd" class="dpad-btn flex-1 rounded-t-lg flex flex-col items-center justify-center hover:bg-gray-800 text-2xl" onmousedown="startTank('leftforward', this)" onmouseup="stopTank(this)" onmouseleave="stopTank(this)" ontouchstart="startTank('leftforward', this)" ontouchend="stopTank(this)">
                            ▲ <span class="text-[10px] opacity-50 display-key" data-action="left_fwd">1</span>
                        </button>
                        <button id="btnL_Back" class="dpad-btn flex-1 rounded-b-lg flex flex-col items-center justify-center hover:bg-gray-800 text-2xl" onmousedown="startTank('leftbackward', this)" onmouseup="stopTank(this)" onmouseleave="stopTank(this)" ontouchstart="startTank('leftbackward', this)" ontouchend="stopTank(this)">
                            ▼ <span class="text-[10px] opacity-50 display-key" data-action="left_back">Q</span>
                        </button>
                    </div>

                    <!-- Center Speaker (Tank) -->
                    <div class="flex items-center justify-center">
                        <button id="btnSpeakerTank" class="speaker-btn w-16 h-16 flex flex-col items-center justify-center shadow-lg" title="Horn">
                            <span class="text-xl">🔊</span>
                            <span class="text-[8px] mt-1 opacity-70 display-key" data-action="horn">SPACE</span>
                        </button>
                    </div>

                    <!-- Right Track -->
                    <div class="flex-1 h-full flex flex-col gap-2">
                        <div class="text-center text-[10px] text-gray-500 font-mono tracking-widest">RIGHT MOTOR</div>
                        <button id="btnR_Fwd" class="dpad-btn flex-1 rounded-t-lg flex flex-col items-center justify-center hover:bg-gray-800 text-2xl" onmousedown="startTank('rightforward', this)" onmouseup="stopTank(this)" onmouseleave="stopTank(this)" ontouchstart="startTank('rightforward', this)" ontouchend="stopTank(this)">
                            ▲ <span class="text-[10px] opacity-50 display-key" data-action="right_fwd">3</span>
                        </button>
                        <button id="btnR_Back" class="dpad-btn flex-1 rounded-b-lg flex flex-col items-center justify-center hover:bg-gray-800 text-2xl" onmousedown="startTank('rightbackward', this)" onmouseup="stopTank(this)" onmouseleave="stopTank(this)" ontouchstart="startTank('rightbackward', this)" ontouchend="stopTank(this)">
                            ▼ <span class="text-[10px] opacity-50 display-key" data-action="right_back">E</span>
                        </button>
                    </div>

                </div>

            </div>
        </div>

        <!-- Right Column: Servo Keyboard Grid (Right) -->
        <div class="w-full md:w-1/2 flex flex-col p-6 bg-black rounded-xl border border-gray-800 shadow-2xl relative order-1 md:order-2">
            <!-- Decorative Gold Edge Connector line -->
            <div class="absolute bottom-0 left-0 w-full h-2 bg-gradient-to-r from-yellow-600 to-yellow-400 rounded-b-xl opacity-80"></div>
            
            <div class="flex justify-between items-center mb-1 border-b border-gray-800 pb-2">
                <div class="flex flex-col">
                    <h2 class="text-xs font-bold text-gray-400 tracking-widest">MANIPULATOR ARMS</h2>
                    <span class="text-[9px] text-gray-600 font-mono">CONTROLS MOTORS ON PINS 13-16</span>
                </div>
                <div class="text-[10px] text-gray-600 font-mono">MANUAL STEP MODE</div>
            </div>

            <!-- Keyboard Layout Grid -->
            <div class="grid grid-cols-4 gap-3 h-full pb-4 pt-2">
                
                <!-- Headers with Editable Labels -->
                <div class="flex flex-col items-center justify-end pb-2">
                    <div class="text-center text-green-400 font-bold text-base uppercase tracking-wider leading-none mb-1">PIN 13</div>
                    <input type="text" value="SERVO 1" class="text-[10px] text-white font-mono bg-gray-800 px-2 py-0.5 rounded text-center w-20 border-none focus:ring-1 focus:ring-green-400">
                </div>
                <div class="flex flex-col items-center justify-end pb-2">
                    <div class="text-center text-green-400 font-bold text-base uppercase tracking-wider leading-none mb-1">PIN 14</div>
                    <input type="text" value="SERVO 2" class="text-[10px] text-white font-mono bg-gray-800 px-2 py-0.5 rounded text-center w-20 border-none focus:ring-1 focus:ring-green-400">
                </div>
                <div class="flex flex-col items-center justify-end pb-2">
                    <div class="text-center text-green-400 font-bold text-base uppercase tracking-wider leading-none mb-1">PIN 15</div>
                    <input type="text" value="SERVO 3" class="text-[10px] text-white font-mono bg-gray-800 px-2 py-0.5 rounded text-center w-20 border-none focus:ring-1 focus:ring-green-400">
                </div>
                <div class="flex flex-col items-center justify-end pb-2">
                    <div class="text-center text-green-400 font-bold text-base uppercase tracking-wider leading-none mb-1">PIN 16</div>
                    <input type="text" value="SERVO 4" class="text-[10px] text-white font-mono bg-gray-800 px-2 py-0.5 rounded text-center w-20 border-none focus:ring-1 focus:ring-green-400">
                </div>

                <!-- Row 1: CLOSE Controls -->
                <div id="s1_close" class="key-btn close-btn" data-cmd="pin13close">
                    <span class="text-2xl font-bold display-key" data-action="s1_close">7</span>
                    <input type="text" value="CLOSE" class="editable-label text-[9px] opacity-70 mt-1" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">
                </div>

                <div id="s2_close" class="key-btn close-btn" data-cmd="pin14close">
                    <span class="text-2xl font-bold display-key" data-action="s2_close">8</span>
                    <input type="text" value="CLOSE" class="editable-label text-[9px] opacity-70 mt-1" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">
                </div>

                <div id="s3_close" class="key-btn close-btn" data-cmd="pin15close">
                    <span class="text-2xl font-bold display-key" data-action="s3_close">9</span>
                    <input type="text" value="CLOSE" class="editable-label text-[9px] opacity-70 mt-1" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">
                </div>

                <div id="s4_close" class="key-btn close-btn" data-cmd="pin16close">
                    <span class="text-2xl font-bold display-key" data-action="s4_close">0</span>
                    <input type="text" value="CLOSE" class="editable-label text-[9px] opacity-70 mt-1" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">
                </div>


                <!-- Row 2: OPEN Controls -->
                <div id="s1_open" class="key-btn" data-cmd="pin13open">
                    <span class="text-2xl font-bold display-key" data-action="s1_open">U</span>
                    <input type="text" value="OPEN" class="editable-label text-[9px] opacity-70 mt-1" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">
                </div>

                <div id="s2_open" class="key-btn" data-cmd="pin14open">
                    <span class="text-2xl font-bold display-key" data-action="s2_open">I</span>
                    <input type="text" value="OPEN" class="editable-label text-[9px] opacity-70 mt-1" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">
                </div>

                <div id="s3_open" class="key-btn" data-cmd="pin15open">
                    <span class="text-2xl font-bold display-key" data-action="s3_open">O</span>
                    <input type="text" value="OPEN" class="editable-label text-[9px] opacity-70 mt-1" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">
                </div>

                <div id="s4_open" class="key-btn" data-cmd="pin16open">
                    <span class="text-2xl font-bold display-key" data-action="s4_open">P</span>
                    <input type="text" value="OPEN" class="editable-label text-[9px] opacity-70 mt-1" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">
                </div>

            </div>

        </div>

    </main>

    <!-- Footer / Log -->
    <footer class="p-2 bg-black border-t border-gray-900 text-center flex-none">
        <div id="statusLog" class="text-xs text-gray-500 font-mono">> WAITING FOR INPUT...</div>
    </footer>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="fixed inset-0 modal-overlay hidden z-50 flex items-center justify-center p-4">
        <div class="bg-[#111] border border-gray-700 rounded-xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center">
                <h2 class="text-xl font-bold text-green-400 tracking-wider">KEY BINDINGS</h2>
                <button id="closeSettings" class="text-gray-400 hover:text-white text-2xl font-bold">&times;</button>
            </div>
            
            <div class="p-6 overflow-y-auto" id="bindingsList">
                <!-- Dynamically Populated via JS -->
            </div>

            <div class="p-4 border-t border-gray-800 flex justify-end gap-4">
                <button onclick="resetToDefaults()" class="px-4 py-2 rounded bg-red-900/30 text-red-400 border border-red-900 hover:bg-red-900/50 text-xs font-bold tracking-widest">RESET DEFAULTS</button>
                <button onclick="document.getElementById('settingsModal').classList.add('hidden')" class="px-6 py-2 rounded bg-white/10 text-white hover:bg-white/20 text-xs font-bold tracking-widest">DONE</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- Configuration ---
        const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_TX_CHARACTERISTIC_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_RX_CHARACTERISTIC_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

        // --- Key Mapping Configuration ---
        const defaultBindings = {
            // WASD
            'forward': { key: 'w', mode: 'WASD', label: 'Drive Forward', btnId: 'btnUp', cmd: 'forward' },
            'backward': { key: 's', mode: 'WASD', label: 'Drive Backward', btnId: 'btnDown', cmd: 'backward' },
            'left': { key: 'a', mode: 'WASD', label: 'Turn Left', btnId: 'btnLeft', cmd: 'left' },
            'right': { key: 'd', mode: 'WASD', label: 'Turn Right', btnId: 'btnRight', cmd: 'right' },
            
            // TANK
            'left_fwd': { key: '1', mode: 'TANK', label: 'Left Track Fwd', btnId: 'btnL_Fwd', cmd: 'leftforward' },
            'left_back': { key: 'q', mode: 'TANK', label: 'Left Track Back', btnId: 'btnL_Back', cmd: 'leftbackward' },
            'right_fwd': { key: '3', mode: 'TANK', label: 'Right Track Fwd', btnId: 'btnR_Fwd', cmd: 'rightforward' },
            'right_back': { key: 'e', mode: 'TANK', label: 'Right Track Back', btnId: 'btnR_Back', cmd: 'rightbackward' },

            // SERVOS
            's1_open': { key: 'u', mode: 'ALWAYS', label: 'Servo 1 Open', btnId: 's1_open', cmd: 'pin13open' },
            's1_close': { key: '7', mode: 'ALWAYS', label: 'Servo 1 Close', btnId: 's1_close', cmd: 'pin13close' },
            
            's2_open': { key: 'i', mode: 'ALWAYS', label: 'Servo 2 Open', btnId: 's2_open', cmd: 'pin14open' },
            's2_close': { key: '8', mode: 'ALWAYS', label: 'Servo 2 Close', btnId: 's2_close', cmd: 'pin14close' },

            's3_open': { key: 'o', mode: 'ALWAYS', label: 'Servo 3 Open', btnId: 's3_open', cmd: 'pin15open' },
            's3_close': { key: '9', mode: 'ALWAYS', label: 'Servo 3 Close', btnId: 's3_close', cmd: 'pin15close' },

            's4_open': { key: 'p', mode: 'ALWAYS', label: 'Servo 4 Open', btnId: 's4_open', cmd: 'pin16open' },
            's4_close': { key: '0', mode: 'ALWAYS', label: 'Servo 4 Close', btnId: 's4_close', cmd: 'pin16close' },

            // MISC
            'horn': { key: ' ', mode: 'ALWAYS', label: 'Horn', btnId: ['btnSpeaker', 'btnSpeakerTank'], cmd: 'beep' }
        };

        let currentBindings = JSON.parse(localStorage.getItem('robotKeyConfig')) || JSON.parse(JSON.stringify(defaultBindings));
        let keyLookup = {}; // Maps key char to action object

        // --- State ---
        let uBitDevice;
        let rxCharacteristic;
        let connected = false;
        let drivingMode = 'WASD'; // 'WASD' or 'TANK'
        let remappingAction = null; // The action ID currently being remapped

        // --- UI Elements ---
        const connectBtn = document.getElementById('connectBtn');
        const statusLog = document.getElementById('statusLog');
        const settingsModal = document.getElementById('settingsModal');
        
        // --- Init ---
        function initKeySystem() {
            rebuildKeyLookup();
            updateUIKeys();
        }

        function rebuildKeyLookup() {
            keyLookup = {};
            for (const [actionId, config] of Object.entries(currentBindings)) {
                const k = config.key.toLowerCase();
                if (!keyLookup[k]) keyLookup[k] = [];
                keyLookup[k].push({ actionId, ...config });
            }
        }

        function updateUIKeys() {
            // Update the display text on the main controller buttons
            document.querySelectorAll('.display-key').forEach(el => {
                const action = el.getAttribute('data-action');
                if (action && currentBindings[action]) {
                    let k = currentBindings[action].key.toUpperCase();
                    if (k === ' ') k = 'SPACE';
                    el.innerText = k;
                }
            });
        }

        function saveBindings() {
            localStorage.setItem('robotKeyConfig', JSON.stringify(currentBindings));
            rebuildKeyLookup();
            updateUIKeys();
            renderSettingsModal(); // Refresh modal if open
        }

        function resetToDefaults() {
            currentBindings = JSON.parse(JSON.stringify(defaultBindings));
            saveBindings();
        }

        // --- Settings Modal Logic ---
        document.getElementById('settingsBtn').addEventListener('click', () => {
            renderSettingsModal();
            settingsModal.classList.remove('hidden');
        });

        document.getElementById('closeSettings').addEventListener('click', () => {
            settingsModal.classList.add('hidden');
            remappingAction = null;
        });

        function renderSettingsModal() {
            const container = document.getElementById('bindingsList');
            container.innerHTML = '';

            const groups = {
                'Driving (WASD)': ['forward', 'backward', 'left', 'right'],
                'Driving (Tank)': ['left_fwd', 'left_back', 'right_fwd', 'right_back'],
                'Manipulator Arms': ['s1_open', 's1_close', 's2_open', 's2_close', 's3_open', 's3_close', 's4_open', 's4_close'],
                'Misc': ['horn']
            };

            for (const [groupName, actions] of Object.entries(groups)) {
                const groupHeader = document.createElement('h3');
                groupHeader.className = "text-gray-500 text-xs font-bold uppercase tracking-widest mt-4 mb-2";
                groupHeader.innerText = groupName;
                container.appendChild(groupHeader);

                actions.forEach(actionId => {
                    const config = currentBindings[actionId];
                    const row = document.createElement('div');
                    row.className = 'bind-row';
                    
                    const label = document.createElement('span');
                    label.className = "text-sm text-gray-300";
                    label.innerText = config.label;

                    const btn = document.createElement('button');
                    btn.className = `bind-key ${remappingAction === actionId ? 'recording' : ''}`;
                    let displayKey = config.key.toUpperCase();
                    if (displayKey === ' ') displayKey = 'SPACE';
                    btn.innerText = remappingAction === actionId ? 'PRESS KEY...' : displayKey;
                    
                    btn.onclick = () => {
                        remappingAction = actionId;
                        renderSettingsModal(); // Update to show "Press Key"
                    };

                    row.appendChild(label);
                    row.appendChild(btn);
                    container.appendChild(row);
                });
            }
        }

        // --- Bluetooth Functions ---
        async function connect() {
            try {
                log("> REQUESTING DEVICE...");
                uBitDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "BBC micro:bit" }],
                    optionalServices: [UART_SERVICE_UUID]
                });
                uBitDevice.addEventListener('gattserverdisconnected', onDisconnected);
                const server = await uBitDevice.gatt.connect();
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                const txCharacteristic = await service.getCharacteristic(UART_TX_CHARACTERISTIC_UUID);
                txCharacteristic.startNotifications();
                txCharacteristic.addEventListener("characteristicvaluechanged", onTxCharacteristicValueChanged);
                rxCharacteristic = await service.getCharacteristic(UART_RX_CHARACTERISTIC_UUID);
                connected = true;
                updateConnectionUI();
                log("> CONNECTED_");
            } catch (error) {
                log("> ERROR: " + error);
                console.error(error);
            }
        }

        function disconnect() {
            if (!uBitDevice) return;
            if (uBitDevice.gatt.connected) {
                uBitDevice.gatt.disconnect();
            }
        }

        function onDisconnected(event) {
            connected = false;
            updateConnectionUI();
            log("> DISCONNECTED_");
        }

        function updateConnectionUI() {
            const btText = document.getElementById('btText');
            if (connected) {
                connectBtn.classList.add('connected');
                btText.innerText = "DISCONNECT";
            } else {
                connectBtn.classList.remove('connected');
                btText.innerText = "CONNECT";
            }
        }

        let queue = Promise.resolve();
        function queueGattOperation(operation) {
            queue = queue.then(operation, operation);
            return queue;
        }

        async function sendUART(data) {
            log("> SENDING: " + data);
            if (!connected || !rxCharacteristic) {
                console.log("Simulated Send:", data);
                return;
            }
            let encoder = new TextEncoder();
            let stringData = data + "\n"; 
            queueGattOperation(() => rxCharacteristic.writeValue(encoder.encode(stringData))
                .catch(error => console.error('Write Error:', error)));
        }

        function onTxCharacteristicValueChanged(event) {
            let receivedData = new TextDecoder().decode(event.target.value);
            console.log("RX:", receivedData);
        }

        function log(msg) {
            statusLog.innerText = msg;
        }

        connectBtn.addEventListener('click', () => {
            if (connected) disconnect();
            else connect();
        });

        // --- Helper Functions ---
        function switchMode(mode) {
            drivingMode = mode;
            const tabWASD = document.getElementById('tabWASD');
            const tabTank = document.getElementById('tabTank');
            const panelWASD = document.getElementById('panelWASD');
            const panelTank = document.getElementById('panelTank');

            if (mode === 'WASD') {
                tabWASD.classList.add('active');
                tabTank.classList.remove('active');
                panelWASD.classList.remove('hidden');
                panelTank.classList.add('hidden');
                log("> MODE: STANDARD WASD");
            } else {
                tabWASD.classList.remove('active');
                tabTank.classList.add('active');
                panelWASD.classList.add('hidden');
                panelTank.classList.remove('hidden');
                log("> MODE: L/R TANK CONTROL");
            }
        }

        window.startTank = function(cmd, el) {
            el.classList.add('active');
            sendUART(cmd);
        }
        window.stopTank = function(el) {
            el.classList.remove('active');
            sendUART('stop');
        }

        // --- Global Input Handler ---

        document.addEventListener('keydown', (e) => {
            // 1. Handle Remapping Mode
            if (remappingAction) {
                e.preventDefault();
                const newKey = e.key.toLowerCase();
                
                // Validate key (optional: prevent 'Escape' from binding if used to close)
                if (newKey === 'escape') {
                    remappingAction = null;
                    renderSettingsModal();
                    return;
                }

                currentBindings[remappingAction].key = newKey;
                remappingAction = null; // Exit recording mode
                saveBindings();
                return;
            }

            if (e.repeat) return; 
            if (e.target.tagName === 'INPUT') return;

            const key = e.key.toLowerCase();
            const actions = keyLookup[key];

            if (actions) {
                actions.forEach(action => {
                    // Check Mode Validity
                    if (action.mode === 'ALWAYS' || action.mode === drivingMode) {
                        e.preventDefault(); // Prevent scrolling for bound keys
                        
                        // Visual Feedback
                        const btnIds = Array.isArray(action.btnId) ? action.btnId : [action.btnId];
                        btnIds.forEach(id => {
                            const btn = document.getElementById(id);
                            if (btn) btn.classList.add('active');
                        });

                        // Send Command
                        sendUART(action.cmd);
                    }
                });
            }
        });

        document.addEventListener('keyup', (e) => {
            // Ignore keyup during remapping
            if (remappingAction) return;
            if (e.target.tagName === 'INPUT') return;

            const key = e.key.toLowerCase();
            const actions = keyLookup[key];

            if (actions) {
                let stopSent = false;

                actions.forEach(action => {
                    if (action.mode === 'ALWAYS' || action.mode === drivingMode) {
                        
                        // Remove Visual Feedback
                        const btnIds = Array.isArray(action.btnId) ? action.btnId : [action.btnId];
                        btnIds.forEach(id => {
                            const btn = document.getElementById(id);
                            if (btn) btn.classList.remove('active');
                        });

                        // Send Stop if it's a driving command
                        if (!stopSent && (action.mode === 'WASD' || action.mode === 'TANK')) {
                            sendUART("stop");
                            stopSent = true; 
                        }
                    }
                });
            }
        });

        // --- Mouse/Touch Logic for Buttons (Standard non-tank buttons) ---
        const setupButton = (btnId, cmdStart, cmdEnd) => {
            const btn = document.getElementById(btnId);
            if (!btn) return;

            const start = (e) => {
                if (e.target.tagName === 'INPUT') return; // Ignore input clicks
                if(e.cancelable) e.preventDefault();
                btn.classList.add('active');
                if (cmdStart) sendUART(cmdStart);
            };
            const end = (e) => {
                if (e.target.tagName === 'INPUT') return;
                if(e.cancelable) e.preventDefault();
                btn.classList.remove('active');
                if (cmdEnd) sendUART(cmdEnd);
            };

            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
            btn.addEventListener('touchstart', start);
            btn.addEventListener('touchend', end);
        };

        // We only need to setup the non-inline buttons here (WASD + Speaker)
        setupButton('btnUp', "forward", "stop");
        setupButton('btnDown', "backward", "stop");
        setupButton('btnLeft', "left", "stop");
        setupButton('btnRight', "right", "stop");
        setupButton('btnSpeaker', "beep", null);
        setupButton('btnSpeakerTank', "beep", null);

        // Servos are handled via class selector at bottom, Tank via inline attributes.
        // But we need to update the servo logic to respect the input field protection.
        document.querySelectorAll('.key-btn').forEach(btn => {
            const cmd = btn.getAttribute('data-cmd');
            if(!cmd) return;

            const start = (e) => {
                if (e.target.tagName === 'INPUT') return;
                if(e.cancelable) e.preventDefault();
                btn.classList.add('active');
                sendUART(cmd); 
            };
            const end = (e) => {
                if (e.target.tagName === 'INPUT') return;
                if(e.cancelable) e.preventDefault();
                btn.classList.remove('active');
            };

            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
            btn.addEventListener('touchstart', start);
            btn.addEventListener('touchend', end);
        });

        // Initialize System
        initKeySystem();

    </script>
</body>
</html>
